name: NPM Release + Compatibility Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  validate:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck & Build
      run: npm run build

    - name: NPM Pack (Capture Filename)
      id: pack
      run: |
        PACK_PATH=$(npm pack | tail -n 1)
        echo "PACK_PATH=${PACK_PATH}" >> $GITHUB_ENV
      shell: bash

    - name: E2E Validation (CLI Install)
      run: |
        mkdir e2e-test
        cd e2e-test
        npm init -y
        npm install ../${{ env.PACK_PATH }}
        
        echo "Running CLI Validation..."
        npx nos-skill list
        npx nos-skill search nosana
        npx nos-skill inspect deploy-ai-project
        npx nos-skill doctor
        npx nos-skill init --type minimal test-skill
        
        if [ ! -f "test-skill/SKILL.md" ]; then
          echo "Error: test-skill not scaffolded correctly"
          exit 1
        fi
      shell: bash

  publish:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'
      
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-publish-validation:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Verify Live NPM Package
        run: |
          npm install -g nos-skill@beta
          nos-skill list
          nos-skill search nosana
        shell: bash
