name: Public NPM Distribution Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours to ensure registry availability
  workflow_dispatch: # Allow manual trigger

jobs:
  validate-distribution:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify NPM Registry Availability
        run: |
          echo "Checking if nos-skill@beta is available..."
          npm view nos-skill@beta version
        shell: bash

      - name: Test NPX Runtime (List)
        run: |
          echo "Validating registry loading via npx..."
          npx -y nos-skill@beta list
        shell: bash

      - name: Test Semantic Search
        run: |
          echo "Validating search engine..."
          npx -y nos-skill@beta search nosana
        shell: bash

      - name: Test Skill Inspection
        run: |
          echo "Validating intelligence engine (inspect)..."
          npx -y nos-skill@beta inspect deploy-ai-project
        shell: bash

      - name: Test Scaffolding (Init)
        run: |
          echo "Validating template resolution and scaffolding..."
          # Move to a clean temp directory to ensure no local file interference
          mkdir -p ../isolated-test
          cd ../isolated-test
          npx -y nos-skill@beta init test-skill --type nosana-app
          
          if [ ! -f "test-skill/metadata.json" ]; then
            echo "Error: metadata.json missing in scaffolded skill"
            exit 1
          fi
          
          if [ ! -f "test-skill/SKILL.md" ]; then
            echo "Error: SKILL.md missing in scaffolded skill"
            exit 1
          fi
          echo "Scaffolding validation passed."
        shell: bash

      - name: Test System Diagnostics (Doctor)
        run: |
          echo "Validating system health checks..."
          npx -y nos-skill@beta doctor
        shell: bash

      - name: Test Security Audit
        run: |
          echo "Validating security engine..."
          npx -y nos-skill@beta audit --registry
        shell: bash
